<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" style="background:#050B14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="35%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48BEC1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="dualHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E3D"/>
      <stop offset="50%" stop-color="#091427"/>
      <stop offset="100%" stop-color="#141E34"/>
    </linearGradient>

    <linearGradient id="appleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#48BEC1"/>
    </linearGradient>

    <linearGradient id="samsungBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="greenBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <radialGradient id="vsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48BEC1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#48BEC1" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="393" height="852" fill="url(#bgGrad2)"/>

  <!-- ==================== STATUS BAR ==================== -->
  <g id="statusBar">
    <text x="34" y="32" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="-0.3">9:41</text>
    
    <!-- Dynamic Island -->
    <rect x="133" y="11" width="127" height="30" rx="15" fill="#000000"/>
    <circle cx="236" cy="26" r="4.5" fill="#141414"/>
    <circle cx="236" cy="26" r="2" fill="#0B2027"/>
    <circle cx="218" cy="26" r="2" fill="#0E1810"/>

    <!-- Right Icons -->
    <rect x="306" y="24" width="3" height="4" rx="0.8" fill="#FFFFFF"/>
    <rect x="311" y="21" width="3" height="7" rx="0.8" fill="#FFFFFF"/>
    <rect x="316" y="18" width="3" height="10" rx="0.8" fill="#FFFFFF"/>
    <rect x="321" y="15" width="3" height="13" rx="0.8" fill="#FFFFFF"/>
    <text x="328" y="26" font-size="9" font-weight="700" fill="#FFFFFF">5G</text>
    <rect x="348" y="17" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
    <rect x="350" y="19" width="16" height="7" rx="1.5" fill="#10B981"/>
    <path d="M 371 20.5 Q 372 21 372 22.5 Q 372 24 371 24.5 Z" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>

  <!-- ==================== ENGINE TOP NAV ==================== -->
  <g id="engineNav" transform="translate(16, 52)">
    <!-- Back Button -->
    <rect width="32" height="32" rx="16" fill="#0B162B" stroke="rgba(255,255,255,0.08)"/>
    <path d="M 18 11 L 13 16 L 18 21" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Title & Lab Badge -->
    <text x="44" y="16" font-size="16" font-weight="800" fill="#FFFFFF">Hardware Compare Lab</text>
    <g transform="translate(44, 21)">
      <circle cx="3" cy="4" r="3" fill="#10B981"/>
      <text x="10" y="7" font-size="9" font-weight="600" fill="#10B981">BuyTech Verified Agency Benchmark v4.2</text>
    </g>

    <!-- Right Action (Share / Swap) -->
    <g transform="translate(328, 0)">
      <rect width="32" height="32" rx="16" fill="#0B162B" stroke="#48BEC1" stroke-width="0.8"/>
      <path d="M 11 16 L 21 16 M 17 12 L 21 16 L 17 20" stroke="#48BEC1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ==================== SIDE-BY-SIDE DUAL DEVICE HEADER ==================== -->
  <g id="dualDeviceHeader" transform="translate(16, 96)" filter="url(#shadowBox)">
    <!-- Card Frame -->
    <rect width="361" height="162" rx="18" fill="url(#dualHeaderGrad)" stroke="#48BEC1" stroke-width="1.2" stroke-opacity="0.35"/>

    <!-- Ambient VS Glow Center -->
    <circle cx="180.5" cy="81" r="50" fill="url(#vsGlow)"/>

    <!-- LEFT DEVICE: iPhone 16 Pro Max -->
    <g transform="translate(14, 14)">
      <!-- Mini Phone Icon -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="34" height="48" rx="6" fill="#A88C68" stroke="#D4BD9E" stroke-width="0.8"/>
        <rect x="3" y="3" width="16" height="16" rx="4" fill="#8C704D"/>
        <circle cx="8" cy="8" r="2.5" fill="#0F172A"/>
        <circle cx="8" cy="14" r="2.5" fill="#0F172A"/>
        <circle cx="14" cy="11" r="2.5" fill="#0F172A"/>
      </g>

      <!-- Badge: Overall Winner -->
      <g transform="translate(42, 2)">
        <rect width="102" height="16" rx="8" fill="rgba(245,158,11,0.2)" stroke="#F59E0B" stroke-width="0.8"/>
        <text x="51" y="11.5" font-size="7.5" font-weight="700" fill="#F59E0B" text-anchor="middle">🏆 Winner • 9.4 / 10</text>
      </g>

      <!-- Device Name & Spec -->
      <text x="0" y="66" font-size="13" font-weight="800" fill="#FFFFFF">iPhone 16 Pro Max</text>
      <text x="0" y="80" font-size="9.5" font-weight="500" fill="#94A3B8">A18 Pro (3nm) • 8GB</text>

      <!-- Best Agency Price -->
      <text x="0" y="104" font-size="15" font-weight="800" fill="#48BEC1">SAR 5,099</text>
      <text x="0" y="118" font-size="8.5" font-weight="600" fill="#10B981">Arab Computers (Agency)</text>

      <!-- Tag -->
      <g transform="translate(0, 126)">
        <rect width="65" height="14" rx="4" fill="#0A1830"/>
        <text x="32" y="10" font-size="7.5" font-weight="600" fill="#60A5FA" text-anchor="middle">2-Yr Warranty</text>
      </g>
    </g>

    <!-- CENTER "VS" BADGE -->
    <g transform="translate(162.5, 63)">
      <circle cx="18" cy="18" r="18" fill="#050B14" stroke="#48BEC1" stroke-width="1.8"/>
      <circle cx="18" cy="18" r="14" fill="#0B2960"/>
      <text x="18" y="22.5" font-size="11" font-weight="900" fill="#48BEC1" text-anchor="middle" letter-spacing="-0.5">VS</text>
    </g>

    <!-- RIGHT DEVICE: Galaxy S24 Ultra -->
    <g transform="translate(208, 14)">
      <!-- Mini Phone Icon -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="34" height="48" rx="3" fill="#334155" stroke="#64748B" stroke-width="0.8"/>
        <!-- Quad lens vertical -->
        <circle cx="7" cy="8" r="2.5" fill="#0F172A" stroke="#94A3B8" stroke-width="0.5"/>
        <circle cx="7" cy="15" r="2.5" fill="#0F172A" stroke="#94A3B8" stroke-width="0.5"/>
        <circle cx="7" cy="22" r="2.5" fill="#0F172A" stroke="#94A3B8" stroke-width="0.5"/>
        <circle cx="15" cy="15" r="2" fill="#0F172A"/>
      </g>

      <!-- Rating Badge -->
      <g transform="translate(0, 2)">
        <rect width="98" height="16" rx="8" fill="rgba(148,163,184,0.15)" stroke="#64748B" stroke-width="0.8"/>
        <text x="49" y="11.5" font-size="7.5" font-weight="700" fill="#CBD5E1" text-anchor="middle">Score • 9.1 / 10</text>
      </g>

      <!-- Device Name & Spec -->
      <text x="0" y="66" font-size="13" font-weight="800" fill="#FFFFFF">Galaxy S24 Ultra</text>
      <text x="0" y="80" font-size="9.5" font-weight="500" fill="#94A3B8">Snapdragon 8 Gen 3</text>

      <!-- Best Agency Price -->
      <text x="0" y="104" font-size="15" font-weight="800" fill="#E2E8F0">SAR 4,699</text>
      <text x="0" y="118" font-size="8.5" font-weight="600" fill="#94A3B8">Samsung KSA (Agency)</text>

      <!-- Tag -->
      <g transform="translate(0, 126)">
        <rect width="65" height="14" rx="4" fill="#0F172A"/>
        <text x="32" y="10" font-size="7.5" font-weight="600" fill="#94A3B8" text-anchor="middle">2-Yr Warranty</text>
      </g>
    </g>
  </g>

  <!-- ==================== SPEC SECTION 1: PROCESSOR BENCHMARK ==================== -->
  <g id="specSection1" transform="translate(16, 270)">
    <rect width="361" height="132" rx="14" fill="#08101E" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(14, 12)">
      <text x="0" y="10" font-size="11.5" font-weight="700" fill="#FFFFFF">⚡ Processor Performance (Geekbench 6)</text>
      <rect x="250" y="-1" width="82" height="15" rx="7.5" fill="rgba(16,185,129,0.15)"/>
      <text x="291" y="9.5" font-size="7.5" font-weight="700" fill="#10B981" text-anchor="middle">+52% A18 Lead</text>
    </g>

    <!-- Metric 1: Single-Core -->
    <g transform="translate(14, 38)">
      <text x="0" y="8" font-size="9.5" font-weight="500" fill="#94A3B8">Single-Core Score</text>
      <text x="140" y="8" font-size="9.5" font-weight="700" fill="#48BEC1">3,420 pts</text>
      <text x="278" y="8" font-size="9.5" font-weight="700" fill="#818CF8">2,240 pts</text>

      <!-- Bars -->
      <!-- Left bar (Apple) -->
      <rect x="0" y="14" width="160" height="7" rx="3.5" fill="#0F1E36"/>
      <rect x="0" y="14" width="155" height="7" rx="3.5" fill="url(#appleBarGrad)"/>
      <!-- Right bar (Samsung) -->
      <rect x="172" y="14" width="160" height="7" rx="3.5" fill="#0F1E36"/>
      <rect x="172" y="14" width="102" height="7" rx="3.5" fill="url(#samsungBarGrad)"/>
    </g>

    <!-- Metric 2: Multi-Core -->
    <g transform="translate(14, 76)">
      <text x="0" y="8" font-size="9.5" font-weight="500" fill="#94A3B8">Multi-Core Score</text>
      <text x="140" y="8" font-size="9.5" font-weight="700" fill="#48BEC1">8,680 pts</text>
      <text x="278" y="8" font-size="9.5" font-weight="700" fill="#818CF8">7,120 pts</text>

      <!-- Bars -->
      <rect x="0" y="14" width="160" height="7" rx="3.5" fill="#0F1E36"/>
      <rect x="0" y="14" width="156" height="7" rx="3.5" fill="url(#appleBarGrad)"/>
      
      <rect x="172" y="14" width="160" height="7" rx="3.5" fill="#0F1E36"/>
      <rect x="172" y="14" width="128" height="7" rx="3.5" fill="url(#samsungBarGrad)"/>
    </g>

    <!-- Mini Subtext Note -->
    <text x="14" y="120" font-size="8" fill="#64748B">A18 Pro delivers superior power efficiency and hardware ray tracing in AAA games.</text>
  </g>

  <!-- ==================== SPEC SECTION 2: CAMERA SENSORS & OPTICS ==================== -->
  <g id="specSection2" transform="translate(16, 412)">
    <rect width="361" height="142" rx="14" fill="#08101E" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(14, 12)">
      <text x="0" y="10" font-size="11.5" font-weight="700" fill="#FFFFFF">📸 Camera Optics & Sensor Hardware</text>
    </g>

    <!-- Row 1: Primary Sensor -->
    <g transform="translate(14, 34)">
      <!-- Left (Apple) -->
      <rect width="160" height="34" rx="8" fill="#0B1528"/>
      <text x="8" y="14" font-size="9.5" font-weight="700" fill="#48BEC1">48MP Fusion Sensor</text>
      <text x="8" y="27" font-size="8" fill="#94A3B8">1/1.28", f/1.78, 2.44µm Quad</text>

      <!-- Right (Samsung) -->
      <g transform="translate(172, 0)">
        <rect width="160" height="34" rx="8" fill="#0B1528"/>
        <text x="8" y="14" font-size="9.5" font-weight="700" fill="#818CF8">200MP ISOCELL HP2</text>
        <text x="8" y="27" font-size="8" fill="#94A3B8">1/1.3", f/1.7, Multi-PDAF</text>
      </g>
    </g>

    <!-- Row 2: Telephoto Zoom -->
    <g transform="translate(14, 74)">
      <!-- Left -->
      <rect width="160" height="34" rx="8" fill="#0B1528"/>
      <text x="8" y="14" font-size="9.5" font-weight="700" fill="#48BEC1">5x Tetraprism (120mm)</text>
      <text x="8" y="27" font-size="8" fill="#94A3B8">3D Sensor-Shift OIS</text>

      <!-- Right -->
      <g transform="translate(172, 0)">
        <rect width="160" height="34" rx="8" fill="#0B1528"/>
        <text x="8" y="14" font-size="9.5" font-weight="700" fill="#818CF8">5x Periscope + 3x Optical</text>
        <text x="8" y="27" font-size="8" fill="#94A3B8">100x Space Zoom Engine</text>
      </g>
    </g>

    <!-- Row 3: Video Capability Tag -->
    <g transform="translate(14, 116)">
      <text x="0" y="12" font-size="8.5" font-weight="600" fill="#10B981">✓ 4K 120fps Dolby Vision • ProRes Log</text>
      <text x="172" y="12" font-size="8.5" font-weight="600" fill="#818CF8">✓ 8K 30fps • 4K 120fps HDR10+</text>
    </g>
  </g>

  <!-- ==================== SPEC SECTION 3: BATTERY & DISPLAY ==================== -->
  <g id="specSection3" transform="translate(16, 564)">
    <rect width="361" height="124" rx="14" fill="#08101E" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(14, 12)">
      <text x="0" y="10" font-size="11.5" font-weight="700" fill="#FFFFFF">🔋 Battery Endurance & Display Lab</text>
    </g>

    <!-- Battery Playback -->
    <g transform="translate(14, 36)">
      <text x="0" y="8" font-size="9.5" font-weight="500" fill="#94A3B8">Video Playback Runtime</text>
      <text x="136" y="8" font-size="9.5" font-weight="700" fill="#10B981">29.0 hrs</text>
      <text x="278" y="8" font-size="9.5" font-weight="700" fill="#E2E8F0">26.5 hrs</text>

      <rect x="0" y="14" width="160" height="6" rx="3" fill="#0F1E36"/>
      <rect x="0" y="14" width="154" height="6" rx="3" fill="url(#greenBarGrad)"/>
      
      <rect x="172" y="14" width="160" height="6" rx="3" fill="#0F1E36"/>
      <rect x="172" y="14" width="138" height="6" rx="3" fill="url(#greenBarGrad)"/>
    </g>

    <!-- Display Outdoor Brightness -->
    <g transform="translate(14, 72)">
      <text x="0" y="8" font-size="9.5" font-weight="500" fill="#94A3B8">Peak Outdoor Brightness</text>
      <text x="136" y="8" font-size="9.5" font-weight="700" fill="#94A3B8">2,000 nits</text>
      <text x="274" y="8" font-size="9.5" font-weight="700" fill="#F59E0B">2,600 nits ★</text>

      <rect x="0" y="14" width="160" height="6" rx="3" fill="#0F1E36"/>
      <rect x="0" y="14" width="122" height="6" rx="3" fill="#38BDF8"/>
      
      <rect x="172" y="14" width="160" height="6" rx="3" fill="#0F1E36"/>
      <rect x="172" y="14" width="160" height="6" rx="3" fill="#F59E0B"/>
    </g>

    <!-- Feature comparison tag -->
    <text x="14" y="112" font-size="8" fill="#64748B">S24 Ultra features Gorilla Glass Armor with 75% surface anti-reflection coating.</text>
  </g>

  <!-- ==================== BUYTECH VERDICT BANNER ==================== -->
  <g id="verdictBanner" transform="translate(16, 698)">
    <rect width="361" height="52" rx="12" fill="#07172C" stroke="#48BEC1" stroke-width="1"/>
    <g transform="translate(12, 10)">
      <circle cx="8" cy="8" r="7" fill="#48BEC1"/>
      <text x="8" y="12" font-size="8" font-weight="900" fill="#050B14" text-anchor="middle">AI</text>
      <text x="22" y="8" font-size="10.5" font-weight="800" fill="#48BEC1">BuyTech Hardware Verdict</text>
      <text x="22" y="24" font-size="8.5" font-weight="500" fill="#E2E8F0">Pick <tspan font-weight="700" fill="#FFFFFF">iPhone 16 Pro Max</tspan> for superior 4K120 ProRes and +28% higher 3-yr resale value in KSA. Pick <tspan font-weight="700" fill="#FFFFFF">S24 Ultra</tspan> for anti-glare screen & S-Pen.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM DUAL ACTION CTA ==================== -->
  <g id="bottomCTA" transform="translate(0, 762)">
    <rect width="393" height="90" fill="#050B14" fill-opacity="0.96"/>
    <line x1="0" y1="0" x2="393" y2="0" stroke="rgba(72,190,193,0.2)" stroke-width="1"/>

    <!-- Left Button: Buy iPhone -->
    <g transform="translate(16, 12)">
      <rect width="174" height="46" rx="12" fill="url(#cyanGrad2)"/>
      <text x="87" y="22" font-size="12" font-weight="800" fill="#050B14" text-anchor="middle">Buy iPhone 16 Pro</text>
      <text x="87" y="36" font-size="10" font-weight="700" fill="#0B2960" text-anchor="middle">SAR 5,099 (Authorized)</text>
    </g>

    <!-- Right Button: Buy Samsung -->
    <g transform="translate(203, 12)">
      <rect width="174" height="46" rx="12" fill="#0A1830" stroke="#48BEC1" stroke-width="1"/>
      <text x="87" y="22" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Buy Galaxy S24</text>
      <text x="87" y="36" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">SAR 4,699 (Authorized)</text>
    </g>

    <!-- iOS Home Indicator -->
    <rect x="128" y="76" width="138" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>
</svg>