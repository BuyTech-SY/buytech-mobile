name: buytech_flutter
description: "BuyTech Operations System - Official Mobile Application for Smart Cards, Leads CRM, Store Catalog and Operations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Networking & API
  http: ^1.2.1

  # Local Storage & Session
  shared_preferences: ^2.2.3

  # NFC Reader & Writer (Native for iOS & Android)
  nfc_manager: ^3.3.0

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Native Integrations (WhatsApp, Phone Calls, Share)
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
