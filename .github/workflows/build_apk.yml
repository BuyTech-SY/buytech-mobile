name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform Scaffolding
        run: |
          flutter create --platforms=android --org com.buytech .
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
    <uses-permission android:name=\"android.permission.INTERNET\"/>
    <uses-permission android:name=\"android.permission.NFC\"/>
    <uses-feature android:name=\"android.hardware.nfc\" android:required=\"false\"/>
    <uses-permission android:name=\"android.permission.CAMERA\"/>
    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"/>
          '''
          if 'android.permission.NFC' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuyTech-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: BuyTech Mobile v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 📱 تطبيق BuyTech الرسمي للأندرويد
            تطبيق فلاتر أصلي بالكامل (Pure Native Flutter App).
            - ربط سحابي عبر REST API مع https://op-system.buytech.app
            - إدارة البطاقات الذكية، برمجة NFC، متابعة العملاء CRM، وسلة عروض الأسعار.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
