name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Configure Android Scaffolding, App Launcher Icons & Branding
        run: |
          flutter create --platforms=android --org com.access --project-name buytech_flutter .
          sed -i 's/android:label="buytech_flutter"/android:label="Access"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.NFC"/>\n<uses-feature android:name="android.hardware.nfc" android:required="false"/>\n<uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 -c "
          import os, shutil
          from PIL import Image
          src = 'assets/images/icon-dark.png'
          if not os.path.exists(src):
              src = 'assets/images/access-logo.png'
          img = Image.open(src).convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              target_dir = os.path.join('android', 'app', 'src', 'main', 'res', folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')
          anydpi = os.path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)
          print('Successfully generated all Access app launcher icons!')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/access.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/buytech.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: access-app-release
          path: build/app/outputs/flutter-apk/access.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "Access Cards v2.2.0 (Blinq Edition)"
          body: "Official Native Flutter Release APK for Access Smart Digital Cards (Custom Launcher Icon, Instant Launch without Intro delay, Camera Privacy Dot removed, Elevated Card Design)"
          files: |
            build/app/outputs/flutter-apk/access.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/buytech.apk
        continue-on-error: true
