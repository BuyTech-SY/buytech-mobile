name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Configure Android Scaffolding, App Launcher Icons & Branding
        run: |
          flutter create --platforms=android --org com.access --project-name buytech_flutter .
          sed -i 's/android:label="buytech_flutter"/android:label="Access"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.NFC"/>\n<uses-feature android:name="android.hardware.nfc" android:required="false"/>\n<uses-permission android:name="android.permission.CAMERA"/>' android/app/src/main/AndroidManifest.xml
          pip install pillow
          python3 -c "
          import os, shutil
          from PIL import Image, ImageDraw

          src = 'assets/images/icon-light.png'
          if not os.path.exists(src):
              src = 'assets/images/logo-light.png'
          if not os.path.exists(src):
              src = 'assets/images/access-logo.png'

          img = Image.open(src).convert('RGBA')

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in sizes.items():
              target_dir = os.path.join('android', 'app', 'src', 'main', 'res', folder)
              os.makedirs(target_dir, exist_ok=True)

              # Standard icon with 86% padding
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              inner = int(size * 0.86)
              offset = (size - inner) // 2
              resized = img.resize((inner, inner), Image.Resampling.LANCZOS)
              canvas.paste(resized, (offset, offset), resized)
              canvas.save(os.path.join(target_dir, 'ic_launcher.png'), 'PNG')
              canvas.save(os.path.join(target_dir, 'ic_launcher_foreground.png'), 'PNG')

              # Round icon with luxury white circular canvas
              round_canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(round_canvas)
              draw.ellipse((0, 0, size - 1, size - 1), fill=(255, 255, 255, 255))
              r_inner = int(size * 0.72)
              r_offset = (size - r_inner) // 2
              r_resized = img.resize((r_inner, r_inner), Image.Resampling.LANCZOS)
              round_canvas.paste(r_resized, (r_offset, r_offset), r_resized)
              round_canvas.save(os.path.join(target_dir, 'ic_launcher_round.png'), 'PNG')

          anydpi = os.path.join('android', 'app', 'src', 'main', 'res', 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)
          print('Successfully generated all Access light launcher icons and badges!')
          "

      - name: Configure Permanent Release Keystore & Gradle Signing
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias access_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass access_secret_2026 -keypass access_secret_2026 \
              -dname "CN=Access, OU=Access Mobile, O=Access, L=Damascus, S=Damascus, C=SY"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/release.keystore
            git commit -m "chore: persist permanent release keystore [skip ci]" || true
            git push origin main || true
          else
            echo "Permanent release.keystore already present."
          fi

          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              code = f.read()

          code = code.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          code = code.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          if 'signingConfigs {' not in code:
              signing_block = '''
              signingConfigs {
                  release {
                      keyAlias 'access_key'
                      keyPassword 'access_secret_2026'
                      storeFile file('release.keystore')
                      storePassword 'access_secret_2026'
                  }
              }
              buildTypes {'''
              code = code.replace('buildTypes {', signing_block, 1)

          with open('android/app/build.gradle', 'w') as f:
              f.write(code)
          print('Successfully configured Gradle release signing!')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/access.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/buytech.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: access-app-release
          path: build/app/outputs/flutter-apk/access.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "Access Cards v2.3.0 (Blinq Luxury Edition)"
          body: "Official Native Flutter Release APK for Access Smart Digital Cards (Fixed Launcher Icon with Light Logo, Permanent Release Keystore Signature, Zero Camera Privacy Dot, Dual-Theme Splash Motion)"
          files: |
            build/app/outputs/flutter-apk/access.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/buytech.apk
        continue-on-error: true
